name: Release

on:
  push:
    branches:
      - '*/*/main'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Extract release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          LOADER="${BRANCH%%/*}"
          MOD_ID="$(grep '^mod_id=' gradle.properties | cut -d'=' -f2)"
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].body' > pr_body.txt
          echo "tag=${LOADER}-${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=build/libs/${MOD_ID}-${MOD_VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: pr_body.txt
          files: ${{ steps.meta.outputs.jar }}
